services:
  k3s-server:
    image: rancher/k3s:v1.31.4-k3s1
    container_name: k3s-server
    privileged: true
    restart: unless-stopped
    tmpfs:
      - /run
      - /var/run
    ports:
      - "6443:6443"
      - "8080:30080"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/lib/rancher/k3s/server/manifests
        cat > /var/lib/rancher/k3s/server/manifests/lab.yaml << 'EOF'
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: headlamp-admin
          namespace: kube-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: headlamp-admin
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
          - kind: ServiceAccount
            name: headlamp-admin
            namespace: kube-system
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: headlamp
          namespace: kube-system
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: headlamp
          template:
            metadata:
              labels:
                app: headlamp
            spec:
              containers:
                - name: headlamp
                  image: ghcr.io/headlamp-k8s/headlamp:v0.44.0
                  args:
                    - -in-cluster
                  ports:
                    - containerPort: 4466
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: headlamp
          namespace: kube-system
        spec:
          type: NodePort
          selector:
            app: headlamp
          ports:
            - port: 80
              targetPort: 4466
              nodePort: 30080
        ---
        apiVersion: v1
        kind: Namespace
        metadata:
          name: demo
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: cpu-burner
          namespace: demo
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: cpu-burner
          template:
            metadata:
              labels:
                app: cpu-burner
            spec:
              containers:
                - name: burner
                  image: busybox:1.36.1
                  command:
                    - sh
                    - -c
                    - while true; do dd if=/dev/urandom bs=64k count=16 2>/dev/null | sha256sum > /dev/null; done
                  resources:
                    requests:
                      cpu: 50m
                      memory: 16Mi
                    limits:
                      cpu: 200m
                      memory: 32Mi
        EOF
        exec /bin/k3s server

volumes:
  k3s-data:
