name: k8s-playground

services:
  k3s:
    image: rancher/k3s:v1.35.8-k3s1
    container_name: headlamp
    privileged: true
    restart: unless-stopped

    command:
      - server
      # Cilium docs suggest setting `none` to the CNI when using cilium with headlamp
      # curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC='--flannel-backend=none
      # Cilium can replace kube-proxy, that why we are not using `--disable-kube-proxy` yet.
      - --flannel-backend=none
      - --disable-network-policy
      - --disable=traefik
      - --disable=servicelb
      - --write-kubeconfig=/output/kubeconfig.yaml
      - --write-kubeconfig-mode=644
      - --tls-san=127.0.0.1

    ports:
      - "6443:6443"

    volumes:
      - headlamp-data:/var/lib/rancher/headlamp
      - ./.kube:/output

    tmpfs:
      - /run
      - /var/run

volumes:
  k3s-data: