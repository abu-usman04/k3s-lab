name: k8s-playground

services:
  k3s:
    image: rancher/k3s:v1.35.8-k3s1
    container_name: k3s
    hostname: k3s
    privileged: true
    restart: unless-stopped

    entrypoint: [ "/bin/sh", "-c" ]

    command:
      - |
        set -e

        echo "Preparing Cilium host mounts..."

        mkdir -p /sys/fs/bpf
        if ! grep -qs ' /sys/fs/bpf ' /proc/mounts; then
          mount -t bpf bpffs /sys/fs/bpf
        fi
        mount --make-shared /sys/fs/bpf

        mkdir -p /run/cilium/cgroupv2
        if ! grep -qs ' /run/cilium/cgroupv2 ' /proc/mounts; then
          mount -t cgroup2 none /run/cilium/cgroupv2
        fi
        mount --make-shared /run/cilium/cgroupv2

        echo "Starting K3s..."

        exec /bin/k3s server \
          --node-name=k3s \
          --flannel-backend=none \
          --disable-network-policy \
          --disable=traefik \
          --disable=servicelb \
          --write-kubeconfig=/output/kubeconfig.yaml \
          --write-kubeconfig-mode=644

    ports:
      - "6443:6443"

    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-node:/etc/rancher/node
      - ./.kube:/output

    tmpfs:
      - /run
      - /var/run

  tools:
    build:
      context: ./tools

    container_name: k8s-tools

    network_mode: "service:k3s"

    depends_on:
      - k3s

    environment:
      KUBECONFIG: /root/.kube/kubeconfig.yaml

    volumes:
      - ./.kube:/root/.kube:ro
      - ./cilium:/workspace/cilium:ro

volumes:
  k3s-data:
  k3s-node: